apis:
  sample@v1:
    root: docs/openapi.yaml
extends:
  - recommended
rules:
  no-unused-components: error
theme:
  openapi:
    htmlTemplate: ./docs/index.html #в цьому файлі має бути документація
    theme:
      colors:
        primary:
          main: '#32329f' #колір шрифта
    generateCodeSamples:
      languages: # Array of language config objects; indicates in which languages to generate code samples.
        - lang: curl #це запити через термінал
        - lang: Node.js
        - lang: JavaScript
